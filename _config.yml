title: ForRest
description: Auto Programmer
url: "https://LimJaeHwan-real.github.io"
baseurl: "/BlogLim"
lang: ko-KR
timezone: Asia/Seoul
markdown: kramdown
highlighter: rouge
permalink: /:title/

analytics:
  google:
    measurement_id: ""

publisher:
  # Cloudflare Worker 배포 후 공개 API 주소를 입력합니다.
  # GitHub 비밀키나 토큰은 이 파일에 넣지 않습니다.
  api_url: ""

comments:
  provider: ""
  disqus:
    shortname: ""
  giscus:
    repo: "LimJaeHwan-real/BlogLim"
    repo_id: "REPOSITORY_NODE_ID"
    category: "Announcements"
    category_id: "CATEGORY_NODE_ID"
    mapping: "pathname"
    strict: true
    reactions_enabled: true
    emit_metadata: false
    input_position: "bottom"
    lang: "ko"
    loading: "lazy"
    theme_light: "/assets/css/giscus-velog-light.css"
    theme_dark: "/assets/css/giscus-velog-dark.css"

search:
  provider: local
  algolia:
    app_id: ""
    api_key: ""
    index_name: ""
    insights: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "assets"
    values:
      layout: null
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - Jenkinsfile
  - LICENSE
  - NOTICE.md
  - README.md
  - output
  - publisher-worker
  - scripts
  - vendor
